# Niagara Elite Soccer Academy — plain static site, no build step.
# Deploy with this folder (nesa/) as the base directory.
[build]
  publish = "."

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Internal audit notes are not part of the public site.
[[redirects]]
  from = "/NESA-NOTES.md"
  to = "/404.html"
  status = 404
  force = true

# ---------------------------------------------------------------------------
# Existing niagarasocceracademy.com URLs, kept alive so inbound links and
# bookmarks still land on the matching section.
# BEFORE LAUNCH: the Youngstown / Buffalo pages carry local search traffic.
# Consolidating them into one page may cost rankings: consider rebuilding
# them as real pages in this design instead of redirecting (see NESA-NOTES.md).
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/staff.html"
  to = "/#about"
  status = 301
[[redirects]]
  from = "/keeper-academy.html"
  to = "/#goalkeeping"
  status = 301
[[redirects]]
  from = "/buffalo-keeper-academy.html"
  to = "/#goalkeeping"
  status = 301
[[redirects]]
  from = "/field-player-academy.html"
  to = "/#training"
  status = 301
[[redirects]]
  from = "/buffalo-field-player-academy.html"
  to = "/#training"
  status = 301
[[redirects]]
  from = "/field-player-training.html"
  to = "/#training"
  status = 301
[[redirects]]
  from = "/small-group-training.html"
  to = "/#training"
  status = 301
[[redirects]]
  from = "/buffalo-small-group-training.html"
  to = "/#training"
  status = 301
[[redirects]]
  from = "/overnight-camp.html"
  to = "/"
  status = 301
# registration.php is the current registration + payment form. It is NOT
# redirected: decide whether to keep it, rebuild it, or retire it first.
